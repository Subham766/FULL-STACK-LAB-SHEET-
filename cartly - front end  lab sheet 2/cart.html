<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Cartly | Shopping Cart</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <!-- HEADER -->

    <header class="header">

        <a href="index.html" class="logo">
            🛒 Cartly
        </a>

        <nav class="navbar">

            <a href="index.html">Home</a>

            <a href="products.html">Products</a>

            <a href="cart.html">
                Cart
                <span id="cart-count">0</span>
            </a>

        </nav>

    </header>


    <!-- CART -->

    <main class="page">

        <div class="page-heading">

            <p class="section-label">
                CARTLY
            </p>

            <h1>
                Shopping Cart
            </h1>

        </div>


        <div id="cart-container"></div>


        <div id="cart-summary"
             class="cart-summary">

            <div class="summary-item">

                <span>Total Items</span>

                <strong id="total-items">
                    0
                </strong>

            </div>


            <div class="summary-item">

                <span>Grand Total</span>

                <strong>
                    ₹<span id="grand-total">0</span>
                </strong>

            </div>


            <a href="checkout.html"
               id="checkout-link"
               class="primary-button">

                Proceed to Checkout

            </a>

        </div>

    </main>


    <!-- FOOTER -->

    <footer class="footer">

        <div class="footer-content">

            <div class="footer-column">

                <h2>🛒 Cartly</h2>

                <p>
                    Easy and convenient online shopping.
                </p>

            </div>


            <div class="footer-column">

                <h3>Navigation</h3>

                <a href="index.html">Home</a>

                <a href="products.html">Products</a>

                <a href="cart.html">Cart</a>

            </div>


            <div class="footer-column">

                <h3>Information</h3>

                <p>Secure Shopping</p>

                <p>Easy Returns</p>

                <p>Fast Delivery</p>

            </div>

        </div>


        <div class="copyright">
            © 2026 Cartly. All Rights Reserved.
        </div>

    </footer>


    <script src="script.js"></script>

</body>

</html>
