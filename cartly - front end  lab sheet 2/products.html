<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Cartly | Products</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <!-- ================= HEADER ================= -->

    <header class="header">

        <a href="index.html" class="logo">
            🛒 Cartly
        </a>

        <nav class="navbar">

            <a href="index.html">Home</a>

            <a href="products.html">Products</a>

            <a href="cart.html">
                Cart
                <span id="cart-count">0</span>
            </a>

        </nav>

    </header>


    <!-- ================= PRODUCTS PAGE ================= -->

    <main class="page">

        <div class="page-heading">

            <p class="section-label">
                CARTLY STORE
            </p>

            <h1>
                All Products
            </h1>

            <p>
                Explore our complete product collection.
            </p>

        </div>


        <!-- SEARCH -->

        <div class="search-box">

            <input
                type="text"
                id="search-input"
                placeholder="🔍 Search products...">

        </div>


        <!-- FILTER -->

        <div class="filter-buttons">

            <button
                class="filter-btn active"
                data-category="All">
                All
            </button>

            <button
                class="filter-btn"
                data-category="Mobiles">
                Mobiles
            </button>

            <button
                class="filter-btn"
                data-category="Laptops">
                Laptops
            </button>

            <button
                class="filter-btn"
                data-category="Audio">
                Audio
            </button>

            <button
                class="filter-btn"
                data-category="Wearables">
                Wearables
            </button>

            <button
                class="filter-btn"
                data-category="Accessories">
                Accessories
            </button>

        </div>


        <!-- PRODUCTS -->

        <div id="product-list"
             class="product-grid">

        </div>

    </main>


    <!-- ================= FOOTER ================= -->

    <footer class="footer">

        <div class="footer-content">

            <div class="footer-column">

                <h2>🛒 Cartly</h2>

                <p>
                    Simple, convenient and reliable shopping.
                </p>

            </div>


            <div class="footer-column">

                <h3>Navigation</h3>

                <a href="index.html">Home</a>

                <a href="products.html">Products</a>

                <a href="cart.html">Cart</a>

            </div>


            <div class="footer-column">

                <h3>Information</h3>

                <p>Secure Shopping</p>

                <p>Easy Returns</p>

                <p>Fast Delivery</p>

            </div>

        </div>


        <div class="copyright">
            © 2026 Cartly. All Rights Reserved.
        </div>

    </footer>


    <script src="script.js"></script>

</body>

</html>
