<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Cartly | Checkout</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <!-- HEADER -->

    <header class="header">

        <a href="index.html" class="logo">
            🛒 Cartly
        </a>

        <nav class="navbar">

            <a href="index.html">Home</a>

            <a href="products.html">Products</a>

            <a href="cart.html">
                Cart
                <span id="cart-count">0</span>
            </a>

        </nav>

    </header>


    <!-- CHECKOUT -->

    <main class="page checkout-page">

        <div class="page-heading">

            <p class="section-label">
                CARTLY CHECKOUT
            </p>

            <h1>
                Complete Your Order
            </h1>

        </div>


        <form id="checkout-form"
              class="checkout-form">


            <!-- NAME -->

            <div class="form-group">

                <label for="name">
                    Full Name *
                </label>

                <input
                    type="text"
                    id="name"
                    placeholder="Enter your full name">

                <small
                    id="name-error"
                    class="error">
                </small>

            </div>


            <!-- EMAIL -->

            <div class="form-group">

                <label for="email">
                    Email Address *
                </label>

                <input
                    type="email"
                    id="email"
                    placeholder="Enter your email">

                <small
                    id="email-error"
                    class="error">
                </small>

            </div>


            <!-- ADDRESS -->

            <div class="form-group">

                <label for="address">
                    Delivery Address *
                </label>

                <textarea
                    id="address"
                    placeholder="Enter your complete address"></textarea>

                <small
                    id="address-error"
                    class="error">
                </small>

            </div>


            <!-- CITY -->

            <div class="form-group">

                <label for="city">
                    City *
                </label>

                <input
                    type="text"
                    id="city"
                    placeholder="Enter your city">

                <small
                    id="city-error"
                    class="error">
                </small>

            </div>


            <!-- PINCODE -->

            <div class="form-group">

                <label for="pincode">
                    Pincode *
                </label>

                <input
                    type="text"
                    id="pincode"
                    maxlength="6"
                    placeholder="Enter 6-digit pincode">

                <small
                    id="pincode-error"
                    class="error">
                </small>

            </div>


            <!-- PAYMENT -->

            <div class="payment-section">

                <h3>
                    Payment Method
                </h3>


                <label class="radio-option">

                    <input
                        type="radio"
                        name="payment"
                        value="cod">

                    Cash on Delivery

                </label>


                <label class="radio-option">

                    <input
                        type="radio"
                        name="payment"
                        value="upi">

                    UPI

                </label>


                <label class="radio-option">

                    <input
                        type="radio"
                        name="payment"
                        value="card">

                    Card

                </label>


                <p
                    id="payment-error"
                    class="error">
                </p>

            </div>


            <button
                type="submit"
                class="primary-button order-button">

                Place Order

            </button>


            <div id="confirmation"></div>

        </form>

    </main>


    <!-- FOOTER -->

    <footer class="footer">

        <div class="footer-content">

            <div class="footer-column">

                <h2>🛒 Cartly</h2>

                <p>
                    Thank you for choosing Cartly.
                </p>

            </div>


            <div class="footer-column">

                <h3>Navigation</h3>

                <a href="index.html">Home</a>

                <a href="products.html">Products</a>

                <a href="cart.html">Cart</a>

            </div>


            <div class="footer-column">

                <h3>Information</h3>

                <p>Secure Shopping</p>

                <p>Easy Returns</p>

                <p>Fast Delivery</p>

            </div>

        </div>


        <div class="copyright">
            © 2026 Cartly. All Rights Reserved.
        </div>

    </footer>


    <script src="script.js"></script>

</body>

</html>
